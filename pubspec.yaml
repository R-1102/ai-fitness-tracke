name: fitness_tracker
description: >-
  AI fitness coach that counts your reps and checks your form in real time
  using on-device pose estimation (Google ML Kit) and custom-trained models.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (your own project — run `flutterfire configure`)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Camera + on-device pose estimation (same 33 BlazePose landmarks as MediaPipe)
  camera: ^0.11.1
  google_mlkit_pose_detection: ^0.14.0

  # Spoken rep counts and form cues ("Voice coaching")
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
