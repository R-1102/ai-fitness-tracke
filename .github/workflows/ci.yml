name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The real Firebase config is not in the repo; use the placeholder so the code compiles.
      - name: Add Firebase options placeholder
        run: cp tools/firebase_options_stub.dart lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
